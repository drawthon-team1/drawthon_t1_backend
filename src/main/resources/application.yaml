spring:
  application:
    name: drawthon_backend

  datasource:
    url: jdbc:h2:file:./data/drawthon
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

server:
  servlet:
    session:
      timeout: 30m #세션 만료 30분
      cookie:
        http-only: true
        same-site: lax

springdoc:
  swagger-ui:
    csrf:
      enabled: true

app:
  frontend-base-url: http://localhost:5173
  backend-base-url: http://localhost:8080
