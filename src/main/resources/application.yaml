spring:
  application:
    name: drawthon_backend
    
  datasource:
    url: jdbc:h2:mem:drawthon;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      timeout: 30m #세션 만료 30분
      cookie:
        http-only: true
        same-site: lax

springdoc:
  swagger-ui:
    csrf:
      enabled: true
      
volunteer:
  api:
    base-url: https://apis.data.go.kr/1741000/volunteerPartcptnService
    service-key: ${VOLUNTEER_API_SERVICE_KEY:}
