spring:
  application:
    name: drawthon_backend
  mvc:
    problemdetails:
      enabled: true
    
  datasource:
    url: jdbc:h2:file:./data/drawthon
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

server:
  servlet:
    session:
      timeout: 30m #세션 만료 30분
      cookie:
        http-only: true
        same-site: lax

springdoc:
  swagger-ui:
    csrf:
      enabled: true
      
volunteer:
  api:
    base-url: https://apis.data.go.kr/1741000/volunteerPartcptnService
    service-key: ${VOLUNTEER_API_SERVICE_KEY:}