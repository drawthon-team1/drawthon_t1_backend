spring:
  application:
    name: drawthon_backend
  # 프로젝트 폴더의 .env(KEY=값 형식)를 읽어 API 키 등을 환경변수처럼 쓴다. 파일이 없으면 무시한다. (.env는 gitignore 대상)
  config:
    import: optional:file:.env[.properties]
    
  datasource:
    url: jdbc:h2:mem:drawthon;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mvc:
    problemdetails:
      enabled: true

server:
  # Render 같은 배포 환경은 PORT 환경변수로 포트를 정해 준다. 로컬은 8080
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m #세션 만료 30분
      cookie:
        http-only: true
        same-site: lax

springdoc:
  swagger-ui:
    csrf:
      enabled: true

app:
  # 팀 초대 링크에 쓰는 프론트 주소. 배포에서는 FRONTEND_BASE_URL로 Vercel 주소를 넣는다
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  auth:
    # 로컬 H2 개발용. 운영에서는 두 값을 false로 설정한다.
    public-admin-signup-enabled: ${PUBLIC_ADMIN_SIGNUP_ENABLED:true}
    dev-admin:
      enabled: ${DEV_ADMIN_ENABLED:true}
      email: ${DEV_ADMIN_EMAIL:admin@drawthon.local}
      password: ${DEV_ADMIN_PASSWORD:drawthon-admin-1234}
      nickname: ${DEV_ADMIN_NICKNAME:개발관리자}
      
volunteer:
  api:
    base-url: https://apis.data.go.kr/1741000/volunteerPartcptnService
    # 1365 검색에 항상 붙이는 상위분야코드. 0600 = 농어촌 봉사 (따옴표가 없으면 YAML이 8진수 숫자로 읽음)
    upper-category-code: "0600"
    # 서버 시작 시 1365 농어촌 공고를 가져와 저장할지와 최대 건수 (H2 메모리 DB라 재시작하면 비기 때문)
    import-on-startup: ${VOLUNTEER_IMPORT_ON_STARTUP:true}
    import-limit: 50
    # 공고 상세 요청 사이 간격(ms). 공공데이터포털이 연속 요청을 429로 막기 때문
    import-interval-ms: 300
    service-key: ${VOLUNTEER_API_SERVICE_KEY:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
