<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원 인증 테스트</title>
</head>
<body>
    <h1>회원 인증 테스트</h1>

    <h2>회원가입</h2>
    <form id="signup">
        <p><label>이메일 <input name="email" type="email" autocomplete="username" maxlength="120" required></label></p>
        <p><label>비밀번호 <input name="password" type="password" autocomplete="new-password" minlength="3" maxlength="72" required></label></p>
        <p><label>닉네임 <input name="nickname" autocomplete="nickname" maxlength="40" required></label></p>
        <button type="submit">회원가입</button>
    </form>

    <h2>로그인</h2>
    <form id="login">
        <p><label>이메일 <input name="email" type="email" autocomplete="username" maxlength="120" required></label></p>
        <p><label>비밀번호 <input name="password" type="password" autocomplete="current-password" maxlength="72" required></label></p>
        <button type="submit">로그인</button>
    </form>

    <h2>로그인 상태</h2>
    <button id="me" type="button">내 정보 조회</button>
    <button id="logout" type="button">로그아웃</button>

    <h2>결과</h2>
    <pre id="result" aria-live="polite">버튼을 눌러 테스트하세요.</pre>

    <script>
        const result = document.getElementById('result');

        async function callApi(path, method = 'GET', body) {
            const headers = {};
            if (method === 'POST') {
                const response = await fetch('/api/auth/csrf', { credentials: 'same-origin' });
                if (!response.ok) {
                    throw new Error(`CSRF 토큰 발급 실패 (HTTP ${response.status})`);
                }
                const csrf = await response.json();
                headers[csrf.headerName] = csrf.token;
            }
            if (body !== undefined) {
                headers['Content-Type'] = 'application/json';
            }
            const response = await fetch(`/api/auth/${path}`, {
                method,
                headers,
                credentials: 'same-origin',
                body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await response.text();
            let output = text;
            try {
                output = JSON.stringify(JSON.parse(text), null, 2);
            } catch {
                // 빈 응답이나 JSON이 아닌 응답도 그대로 표시합니다.
            }
            result.textContent = `${method} /api/auth/${path}\nHTTP ${response.status}\n${output || '로그아웃 완료'}`;
            return response.ok;
        }

        async function run(button, action) {
            button.disabled = true;
            result.textContent = '요청 중...';
            try {
                await action();
            } catch (error) {
                result.textContent = `요청 실패: ${error.message}`;
            } finally {
                button.disabled = false;
            }
        }

        for (const path of ['signup', 'login']) {
            const form = document.getElementById(path);
            form.addEventListener('submit', event => {
                event.preventDefault();
                run(form.querySelector('button'), async () => {
                    const body = Object.fromEntries(new FormData(form));
                    if (await callApi(path, 'POST', body)) {
                        form.elements.namedItem('password').value = '';
                    }
                });
            });
        }

        document.getElementById('me').addEventListener('click', event => {
            run(event.currentTarget, () => callApi('me'));
        });
        document.getElementById('logout').addEventListener('click', event => {
            run(event.currentTarget, () => callApi('logout', 'POST'));
        });
    </script>
</body>
</html>
